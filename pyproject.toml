[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dais-agent"
version = "0.1.0"
description = "Independent LangChain/LangGraph agents on a minimal MLOps stack."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # LangChain / LangGraph / LangSmith
    "langchain>=0.3.0,<0.4",
    "langchain-core>=0.3.0,<0.4",
    "langchain-openai>=0.2.0,<0.3",
    "langgraph>=0.2.0,<0.3",
    "langsmith>=0.1.140",

    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",

    # 외부 호출 / 환경변수 / 재시도
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
# 웹 백엔드 (web/backend, FastAPI :8005) — CLAUDE.md Phase 3
web = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "minio>=7.2",
]

# ──────────────────────────────
# Build (hatch)
# ──────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["agents"]

# ──────────────────────────────
# Pytest
# ──────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: 외부 시스템(8번 서버 LLM 등)에 의존하는 통합 테스트",
]
addopts = "-ra"

# ──────────────────────────────
# Ruff
# ──────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
# 외부 보관 Model training 코드는 lint 대상에서 제외 — 우리 팀 코드만 검사
extend-exclude = [
    "model/dinov3_anomaly/",
    "model/notebooks/",
    "model/weights/",
    "data/",
    ".venv/",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

# FastAPI의 Depends/Query/Body 등은 인자 default 위치에서 호출하는 게 표준 패턴.
# B008 (function-call-in-default-argument) 에서 예외 처리.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.params.Depends",
    "fastapi.params.Query",
]

# ──────────────────────────────
# Mypy
# ──────────────────────────────
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
strict_optional = true
