# 로컬 commit 전 자동 검사.
# 사용법:
#   1. uv pip install pre-commit  (또는 pip)
#   2. pre-commit install
#   3. 이제 git commit 시 자동 실행. 수동: pre-commit run --all-files
#
# 참고: https://pre-commit.com/

repos:
  # ───── Python lint (ruff) ─────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  # ───── 기본 위생 (merge conflict, EOF, trailing whitespace, 큰 파일) ─────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        exclude: ^docker/airflow/dags/  # Jinja 가 들어간 yaml 일 수 있음
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        # weights 나 데이터 실수 커밋 차단 (1MB 초과 차단)
        args: [--maxkb=1000]
      - id: detect-private-key

  # ───── Secret 스캔 (gitleaks) ─────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ───── 외부 코드 / 민감 자산 commit 차단 (local hook) ─────
  - repo: local
    hooks:
      - id: block-external-training-code
        name: Block model/dinov3_anomaly/ (외부 보관 코드 commit 금지)
        entry: bash -c 'if git diff --cached --name-only | grep -qE "^model/dinov3_anomaly/"; then echo ""; echo "❌ model/dinov3_anomaly/ 는 외부 보관 코드입니다 (git 추적 금지)."; echo "   docs/EXTERNAL_CODE.md 참고."; echo ""; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true
      - id: block-weights-and-data
        name: Block .pth / 원본 데이터 파일 commit 금지
        entry: bash -c 'BAD=$(git diff --cached --name-only | grep -E "(\.pth$|^model/weights/|^data/.+\.(png|jpg|jpeg|bmp|dcm)$)" | grep -vE "^\.env\.example$" || true); if [ -n "$BAD" ]; then echo "❌ 다음 파일은 git 추적 금지:"; echo "$BAD"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true
