# 단독 LLM 컨테이너 — Qwen3-VL 서빙 (운영). Agent 들이 쓰는 OpenAI 호환 endpoint 를 제공한다.
# 과거에는 별도 GPU 서버에서 띄웠으나, 서버 이전 후 MLOps 스택과 같은 머신의 GPU 를 쓴다.
# compose 프로젝트만 분리되어 있다 (-p dais-llm). 자세한 경위는 docs/PORTS.md.
# 구 gemma 정의는 docker/llm/ 에 참고용으로만 남아 있다.
#
# 사용법: 같은 폴더의 deploy.sh 참고
#   ./deploy.sh up       # 빌드 + 기동
#   ./deploy.sh health   # 준비 확인
#   ./deploy.sh verify   # tool-call 파서 실측 검증 (필수)
#   ./deploy.sh down     # 종료
#
# 설정값은 저장소 루트 .env 의 LLM_* 섹션에서 주입한다 (deploy.sh 가 --env-file 로 전달).

name: dais-llm

services:
  llm:
    build:
      context: .
      args:
        VLLM_IMAGE: ${VLLM_IMAGE:-vllm/vllm-openai:v0.26.0}
    container_name: dais-llm
    restart: unless-stopped

    ports:
      # MLOps 스택과 같은 머신을 쓰므로 호스트 포트가 실제로 겹친다.
      # 8000 은 Agent API Gateway 예약이라 LLM 은 8010 을 쓴다 (docs/PORTS.md).
      # LLM_BIND_ADDR: 0.0.0.0=전체 / <내부망IP>=내부망 한정 / 127.0.0.1=SSH 터널 전용
      - "${LLM_BIND_ADDR:-0.0.0.0}:${LLM_HOST_PORT:-8000}:8000"

    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      HF_HOME: /root/.cache/huggingface

    volumes:
      # named volume 이 아니라 호스트 bind mount 를 쓴다.
      # named volume 은 호스트에 이미 받아둔 캐시를 재사용하지 못해 매번 다시 받는다.
      - ${HF_CACHE_DIR:?set HF_CACHE_DIR in the repo-root .env, e.g. /home/<user>/.cache/huggingface}:/root/.cache/huggingface
    ipc: host

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s      # 모델 다운로드(~7GB) + 로드 시간 고려

    command:
      # 서빙 모델은 .env 의 LLM_MODEL_ID 로 분리했다 (교체 시 이 파일을 고치지 않는다).
      # 현재 값: cyankiwi/Qwen3-VL-8B-Instruct-AWQ-4bit (compressed-tensors W4A16, ~7GB).
      # ⚠️ RTX 3090 은 Ampere(SM 8.6) 라 FP8 하드웨어 가속이 없다 — FP8 체크포인트는 쓸 수 없고
      #    4bit(AWQ/GPTQ) 를 고른 이유가 이것이다. 24GB GPU 를 DINOv3 추론과 나눠 써야 한다.
      - --model
      - ${LLM_MODEL_ID:?set LLM_MODEL_ID in .env}

      # 모델 중립 alias. 클라이언트(.env 의 LLM_MODEL)는 이 이름만 알면 되고,
      # 이후 서빙 모델을 교체해도 클라이언트를 수정할 필요가 없다.
      - --served-model-name
      - dais-llm
      - qwen3-vl-8b

      - --host
      - 0.0.0.0
      - --port
      - "8000"

      # ⚠️ 이 모델의 native 컨텍스트는 262,144 다.
      #    모델 카드의 예시 명령을 그대로 쓰면 KV 캐시가 감당하지 못하므로 반드시 제한한다.
      #    낮출수록 같은 KV 로 동시 처리량이 늘어난다 — Agent 프롬프트는 16k 로 충분.
      #    24GB 를 DINOv3 와 나눠 쓰므로 KV 예산 자체가 작다. 컨텍스트를 줄이는 편이
      #    util 을 올리는 것보다 상대(ml-inference) 몫을 덜 빼앗는다.
      - --max-model-len
      - "${LLM_MAX_MODEL_LEN:-16384}"

      # 선점량 = GPU 총량 × 이 비율. 가중치(4bit ~6GB)는 줄일 수 없는 바닥이고
      # 남는 만큼이 KV 캐시가 된다. RTX 3090 24,576 MiB 실측 (2026-08-12, nvidia-smi):
      #   0.45 / 16k / seqs 32 → 10,658 MiB 선점  ← 현재
      # 이 GPU 는 DINOv3 추론(ml-inference)과 공유한다. 남는 ~13.5GB 가 그쪽 몫이므로
      # util 을 올리면 추론이 CUDA OOM 으로 죽는다.
      # ⚠️ vLLM 은 기동 시 이 비율만큼 VRAM 을 선점하고 컨테이너 수명 내내 유지한다.
      #    GPU 를 다른 작업과 공유한다면 그만큼 상대가 쓸 수 없다.
      #    변경 시 .env 의 LLM_REQUIRED_FREE_MIB 도 같이 조정할 것.
      - --gpu-memory-utilization
      - "${LLM_GPU_MEM_UTIL:-0.45}"

      # 동시 처리 시퀀스 상한. vLLM 기본 1024 는 이 KV 예산에 비해 과하다.
      # 동시 요청이 적은 내부 Agent 용도에서는 낮게 잡아 KV 를 아끼는 편이 이득이다.
      - --max-num-seqs
      - "${LLM_MAX_NUM_SEQS:-128}"
      - --max-num-batched-tokens
      - "8192"

      # ── 에이전트 tool calling ───────────────────────────
      # 파서 이름이 모델·vLLM 버전마다 다르다 (후보: hermes / qwen3_coder / qwen3_xml).
      # 현재 모델(Qwen3-VL-8B-Instruct) + vLLM v0.11.0 에서는 hermes 로 실측 통과.
      # 모델 또는 vLLM 버전을 바꾸면 './deploy.sh verify' 로 재검증 — 틀리면 일반 응답은 정상인데
      # tool_calls 만 비어서 Agent 가 조용히 깨진다.
      - --enable-auto-tool-choice
      - --tool-call-parser
      - "${LLM_TOOL_PARSER:-hermes}"

      # 이 모델은 vision 입력을 지원한다. 텍스트 전용(0)으로 쓰면
      # 멀티모달 프로파일링이 선점하는 메모리를 KV 캐시로 회수할 수 있다.
      - --limit-mm-per-prompt
      - '{"image":${LLM_MM_IMAGES:-0},"video":0}'

      # ── 인증 (선택) ────────────────────────────────────
      # endpoint 를 사내망 밖으로 노출한다면 활성화하고 .env 의 LLM_API_KEY 를 채운다.
      # - --api-key
      # - ${LLM_API_KEY}

      # ── 기동 실패 시 시도 ──────────────────────────────
      # Mamba cache 관련 에러 → --max-cudagraph-capture-size 256
      # KV 를 더 확보 → --kv-cache-dtype fp8
