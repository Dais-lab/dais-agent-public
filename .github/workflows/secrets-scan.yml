name: Secrets Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  trufflehog:
    name: trufflehog (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 history 스캔 (이전 commit 의 leak 도 발견)

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          trufflehog --version

      - name: Run TruffleHog (verified secrets only)
        # --only-verified: API 호출로 실제 유효한 secret 만 보고 (오탐 거의 0)
        # --fail: 발견 시 exit 1 (CI 실패)
        #
        # --exclude-detectors=lob: Lob(우편발송 API) 오탐 차단.
        #   Lob 키는 `test_` + 32자 내외 형식이라 pytest 관례를 따른 긴 테스트 함수명
        #   (예: test_baseline_spikes_do_not_mask_anomaly) 이 패턴에 걸린다.
        #   게다가 Lob 의 test 환경은 형식만 맞으면 200 을 돌려주므로 --only-verified
        #   로도 걸러지지 않는다. 이 프로젝트는 Lob 을 쓰지 않으므로 디텍터를 끈다.
        #   ⚠️ tests/ 를 통째로 제외하지 말 것 — 테스트 파일의 실제 키 유출을 놓친다.
        run: trufflehog filesystem ./ --only-verified --fail --exclude-detectors=lob

  forbidden-files:
    name: 금지 파일 차단
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .env / weights / 원본 데이터 / 외부 코드 staged 차단
        # .env.example 은 합법 (템플릿) — grep -v 로 예외 처리
        # model/dinov3_anomaly/ 는 외부 보관 코드 (docs/EXTERNAL_CODE.md)
        run: |
          set -e
          BAD=$(git ls-files \
                | grep -E '^\.env$|^\.env\..+|^model/weights/.+\.pth$|^data/.+\.(png|jpg|jpeg|bmp|dcm)$|^model/dinov3_anomaly/' \
                | grep -vE '^\.env\.example$' \
                || true)
          if [ -n "$BAD" ]; then
            echo "❌ 다음 파일들은 git 추적에서 제외되어야 합니다:"
            echo "$BAD"
            echo ""
            echo "model/dinov3_anomaly/ 가 보이면 docs/EXTERNAL_CODE.md 참고 — 외부 보관 코드입니다."
            exit 1
          fi
          echo "✅ 금지 파일 없음"

      - name: 서버 IP / 호스트 절대경로 누출 차단
        # 알려진 내부 IP / 호스트 경로가 코드/문서에 박혀있는지 검사
        run: |
          set -e
          IP_HIT=$(grep -rnE "203\\.250\\.72\\." --include="*.md" --include="*.py" --include="*.yml" --include="*.yaml" --include="Makefile" --include="*.toml" --include="*.sh" --include="Dockerfile" . 2>/dev/null || true)
          PATH_HIT=$(grep -rnE "/home/dais02/" --include="*.md" --include="*.py" --include="*.yml" --include="*.yaml" --include="Makefile" --include="*.toml" --include="*.sh" --include="Dockerfile" . 2>/dev/null | grep -vE "(env var|\.env|env\.example|env-var)" || true)
          if [ -n "$IP_HIT" ] || [ -n "$PATH_HIT" ]; then
            echo "❌ 내부 IP 또는 호스트 절대경로가 노출됨:"
            [ -n "$IP_HIT" ] && { echo "--- 서버 IP ---"; echo "$IP_HIT"; }
            [ -n "$PATH_HIT" ] && { echo "--- 호스트 경로 ---"; echo "$PATH_HIT"; }
            exit 1
          fi
          echo "✅ 내부 IP / 호스트 경로 누출 없음"
